<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 脑力训练游戏平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .forgot-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            margin: 0 12px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: color 0.3s;
        }
        .input-group input:focus + i {
            color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-verify {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .btn-verify:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #718096;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        .login-link a:hover {
            color: #764ba2;
        }
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #718096;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }
        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .step.completed {
            background: #48bb78;
            color: white;
        }
        .step-line {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e2e8f0;
            z-index: 0;
        }
        .step-text {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #718096;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .step.active .step-text {
            color: #667eea;
            font-weight: 600;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="logo">
            <h1>找回密码</h1>
            <p>我们将帮助您重置密码</p>
        </div>
        
        <div class="steps">
            <div class="step-line"></div>
            <div class="step active">
                <span>1</span>
                <div class="step-text">验证身份</div>
            </div>
            <div class="step">
                <span>2</span>
                <div class="step-text">重置密码</div>
            </div>
            <div class="step">
                <span>3</span>
                <div class="step-text">完成</div>
            </div>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="手机号/邮箱" id="username">
            <i class="fas fa-user"></i>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="验证码" id="verifyCode">
            <button class="btn-verify" onclick="sendVerifyCode()">获取验证码</button>
        </div>
        
        <button class="btn-primary" onclick="verifyIdentity()">下一步</button>
        
        <div class="login-link">
            想起密码了？<a href="login.html">返回登录</a>
        </div>
    </div>

    <script>
        let countdown = 60;
        const verifyBtn = document.querySelector('.btn-verify');
        
        function sendVerifyCode() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('请先输入手机号/邮箱');
                return;
            }
            
            // 开始倒计时
            verifyBtn.disabled = true;
            verifyBtn.textContent = `${countdown}秒后重试`;
            
            const timer = setInterval(() => {
                countdown--;
                verifyBtn.textContent = `${countdown}秒后重试`;
                
                if (countdown === 0) {
                    clearInterval(timer);
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = '获取验证码';
                    countdown = 60;
                }
            }, 1000);
            
            // 这里添加发送验证码的逻辑
            alert('验证码已发送');
        }
        
        function verifyIdentity() {
            const username = document.getElementById('username').value;
            const verifyCode = document.getElementById('verifyCode').value;
            
            if (!username || !verifyCode) {
                alert('请填写完整的验证信息');
                return;
            }
            
            // 这里添加验证逻辑
            window.location.href = 'reset_password.html';
        }
    </script>
</body>
</html>
