<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThinkShift - 思维转换</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-title">
                    <img src="assets/logo.png" alt="ThinkShift Logo" class="app-logo">
                    <h1>
                        <span class="title-en">ThinkShift</span>
                        <span class="title-cn">思维转换</span>
                    </h1>
                </div>
            </div>
            <div class="header-right">
                <button class="settings-btn">
                    <img src="assets/icons/settings.svg" alt="设置">
                </button>
            </div>
        </header>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <img src="assets/icons/search.svg" alt="搜索" class="search-icon">
            <input type="text" id="searchInput" placeholder="搜索放松方式">
        </div>

        <!-- 主要功能区 -->
        <main class="app-main">
            <div class="function-grid" id="functionGrid">
                <!-- 功能列表将由 JavaScript 动态生成 -->
            </div>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
