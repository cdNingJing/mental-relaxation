<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 脑力训练游戏平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            margin: 12px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: color 0.3s;
        }
        .input-group input:focus + i {
            color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .btn-primary .btn-text {
            transition: opacity 0.3s;
        }
        .btn-primary.loading .btn-text {
            opacity: 0;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider span {
            padding: 0 15px;
            color: #718096;
            font-size: 14px;
        }
        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .wechat { background: #07C160; }
        .qq { background: #12B7F5; }
        .weibo { background: #E6162D; }
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        .links a:hover {
            color: #764ba2;
        }
        .agreement {
            margin-top: 25px;
            font-size: 12px;
            color: #718096;
            text-align: center;
            line-height: 1.6;
        }
        .agreement a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        .agreement a:hover {
            color: #764ba2;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="./assets/logo.png" alt="Logo">
            <h1>脑力训练游戏平台</h1>
            <p>提升认知能力，保持大脑健康</p>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="手机号/邮箱" id="username">
            <i class="fas fa-user"></i>
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="密码" id="password">
            <i class="fas fa-lock"></i>
        </div>
        
        <button class="btn-primary" onclick="login()">
            <span class="btn-text">登录</span>
        </button>
        
        <div class="links">
            <a href="register.html">注册账号</a>
            <a href="forgot_password.html">忘记密码？</a>
        </div>
        
        <div class="divider">
            <span>其他登录方式</span>
        </div>
        
        <div class="social-login">
            <div class="social-btn wechat" onclick="socialLogin('wechat')">
                <i class="fab fa-weixin"></i>
            </div>
            <div class="social-btn qq" onclick="socialLogin('qq')">
                <i class="fab fa-qq"></i>
            </div>
            <div class="social-btn weibo" onclick="socialLogin('weibo')">
                <i class="fab fa-weibo"></i>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.querySelector('.btn-primary');
            
            if (!username || !password) {
                alert('请填写完整的登录信息');
                return;
            }
            
            // 添加加载动画
            loginBtn.classList.add('loading');
            
            // 模拟登录请求
            setTimeout(() => {
                // 这里添加实际的登录逻辑
                window.location.href = 'index.html';
            }, 1500); // 1.5秒后跳转，模拟网络请求
        }
        
        function socialLogin(platform) {
            // 这里添加第三方登录逻辑
            alert(`正在使用${platform}登录...`);
        }
        
        function showTerms(type) {
            // 这里添加显示条款的逻辑
            const terms = {
                user: '用户协议内容...',
                privacy: '隐私政策内容...'
            };
            alert(terms[type]);
        }
    </script>
</body>
</html>
