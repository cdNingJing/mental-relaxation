<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恢复专注力</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/focusPage.css">
</head>
<body>
    <div class="focus-page-container">
        <!-- 顶部返回按钮 -->
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="focus-scroll-container">
            <div class="focus-content">
                <div class="focus-card">
                    <div class="focus-card-content">
                        <h2>数字排序训练</h2>
                        <p>通过点击数字帮助大脑进入专注模式，适合工作前热身</p>
                        <div class="tip-box">
                            <p>从1开始依次点击到9</p>
                            <p>每完成一关，数字数量会增加</p>
                            <p>持续训练更容易进入心流状态</p>
                        </div>
                        <div class="button-group">
                            <button class="start-button" id="start-focus">开始训练</button>
                            <button class="continue-button" id="continue-focus">继续挑战</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 数字排序游戏全屏容器 -->
    <div class="game-container" id="number-game-container">
        <button class="exit-fullscreen">×</button>
        <button class="help-button" title="查看游戏规则">?</button>
        <div class="game-content">
            <div id="num-container" class="grid-3"></div>
        </div>

        <!-- 数字排序游戏帮助弹窗 -->
        <div class="help-modal">
            <button class="close-help">×</button>
            <h3>游戏规则</h3>
            <div class="help-modal-content">
                <p>1. 您需要按照从小到大的顺序点击这些数字</p>
                <p>2. 每完成一关，网格大小会增加</p>
                <p>3. 挑战自己，争取更快的完成时间！</p>
            </div>
        </div>

        <!-- 数字排序游戏结果弹窗 -->
        <div class="modal-overlay"></div>
        <div class="result-modal">
            <div class="result-time"></div>
            <div class="result-comment"></div>
            <div class="result-buttons">
                <button class="retry-button" id="retry-focus">再试一次</button>
                <button class="next-button" id="next-focus">下一关</button>
            </div>
        </div>
    </div>

    <script src="../js/numberSortGame.js"></script>
    <script src="../js/focusPage.js"></script>

    <style>
    .number-format-tip {
        background: rgba(255, 159, 67, 0.1);
        border-left: 2px solid #FF9F43;
        padding: 10px 15px;
        margin: 15px 0;
        border-radius: 4px;
    }

    .number-format-tip h4 {
        color: #F97316;
        margin: 0 0 8px 0;
        font-size: 0.95em;
    }

    .number-format-tip ul {
        margin: 8px 0;
        padding-left: 20px;
    }

    .number-format-tip li {
        margin: 4px 0;
        color: #666;
        font-size: 0.9em;
    }

    .number-format-tip p {
        margin: 6px 0;
        color: #666;
        font-size: 0.9em;
    }
    </style>
</body>
</html>
