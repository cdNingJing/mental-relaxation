<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>呼吸引导</title>
    <link rel="stylesheet" href="../css/relax.css">
</head>
<body>
    <div class="container">
        <!-- 返回标签 -->
        <a href="javascript:history.back()" class="back-link">
            <img src="../assets/icons/back.svg" alt="返回">
        </a>

        <!-- 信息图标 -->
        <button class="info-btn" id="infoBtn">
            <img src="../assets/icons/info.svg" alt="信息">
        </button>

        <!-- 时间显示 -->
        <div class="time">05:00</div>

        <!-- 底部进度条 -->
        <div class="progress-bar"></div>

        <!-- 呼吸圆圈 -->
        <div class="breath-circle">
            <div class="breath-inner-circle">
                <span class="breath-text">吸气</span>
                <span class="breath-count">4</span>
                <span class="breath-group">第 1 组</span>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="control-section">
            <button class="control-btn pause-btn">
                <img src="../assets/icons/pause.svg" alt="暂停">
            </button>
            <button class="control-btn stop-btn">
                <img src="../assets/icons/stop.svg" alt="结束">
            </button>
        </div>

        <!-- 开始按钮 -->
        <div class="start-section">
            <button class="start-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M8 5v14l11-7z" fill="white"/>
                </svg>
            </button>
            <div class="start-tip">3秒后进入专注模式</div>
        </div>

        <!-- 呼吸模式弹出框 -->
        <div class="modal" id="modeInfoModal">
            <div class="modal-content">
                <button class="modal-close" id="modalCloseBtn">
                    <img src="../assets/icons/close.svg" alt="关闭">
                </button>
                <h3>选择呼吸模式</h3>
                <div class="mode-list">
                    <!-- 模式列表将由 JavaScript 动态渲染 -->
                </div>
            </div>
        </div>

        <!-- 结束弹窗 -->
        <div class="modal" id="summaryModal">
            <div class="modal-content">
                <h3>训练总结</h3>
                <div class="summary-content">
                    <div class="summary-item">
                        <span class="summary-label">训练时长</span>
                        <span class="summary-value" id="summaryDuration">05:00</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">完成组数</span>
                        <span class="summary-value" id="summaryGroups">5组</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">呼吸次数</span>
                        <span class="summary-value" id="summaryBreaths">20次</span>
                    </div>
                    <div class="summary-tip" id="summaryTip">
                        坚持训练可以帮助你更好地管理压力和情绪。
                    </div>
                </div>
                <button class="modal-close" id="summaryCloseBtn">
                    <img src="../assets/icons/close.svg" alt="关闭">
                </button>
            </div>
        </div>
    </div>

    <script src="../js/relax.js"></script>
</body>
</html>
