<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>认知训练</title>
    <link rel="stylesheet" href="../css/cognitive.css">
</head>
<body>
    <div class="cognitive-page-container">
        <!-- 顶部返回按钮 -->
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="cognitive-scroll-container">
            <div class="cognitive-content">
                <div class="cognitive-card">
                    <div class="cognitive-card-content">
                        <h2>认知训练</h2>
                        <p>通过颜色、形状和文字的匹配训练，提升大脑的认知能力</p>
                        <div class="tip-box">
                            <p>观察中心显示的颜色、形状和文字</p>
                            <p>在2秒内判断是否存在矛盾</p>
                            <p>连续判断正确获得连击加成</p>
                        </div>
                        <div class="button-group">
                            <button class="start-button" id="startButton">开始训练</button>
                            <button class="continue-button" id="continueButton">继续挑战</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 认知训练游戏全屏容器 -->
    <div class="game-container" id="cognitive-game-container" style="display: none;">
        <button class="exit-fullscreen" title="退出全屏">×</button>
        <button class="help-button" title="查看游戏规则">?</button>
        
        <div class="game-status">
            <div class="status-card level-card">
                <div class="status-label">等级</div>
                <div class="status-value" id="currentLevel">1</div>
            </div>
            <div class="status-card combo-card" data-combo="0">
                <div class="status-label">连击</div>
                <div class="status-value" id="currentCombo">0</div>
            </div>
            <div class="status-card score-card">
                <div class="status-label">分数</div>
                <div class="status-value" id="currentScore">0</div>
            </div>
        </div>

        <div class="game-content">
            <div class="stimulus" id="stimulus">
                <div class="stimulus-shape"></div>
                <div class="stimulus-word"></div>
                <div class="timer-bar">
                    <div class="timer-progress" id="timerProgress"></div>
                </div>
            </div>

            <div class="response-buttons">
                <button class="response-btn" id="wrongBtn">错误</button>
                <button class="response-btn" id="correctBtn">正确</button>
            </div>

            <div id="effectsContainer" class="effects-container"></div>
        </div>

        <!-- 帮助弹窗 -->
        <div class="help-modal" style="display: none;">
            <button class="close-help">×</button>
            <h3>游戏规则</h3>
            <div class="help-modal-content">
                <p>1. 观察中心显示的颜色、形状和文字</p>
                <p>2. 在2秒内判断是否存在矛盾</p>
                <p>3. 连续判断正确获得连击加成</p>
                <p>4. 每提升5次连击将提升难度等级</p>
            </div>
        </div>

        <!-- 结果弹窗 -->
        <div class="modal-overlay" style="display: none;"></div>
        <div class="result-modal" style="display: none;">
            <div class="result-time"></div>
            <div class="result-comment"></div>
            <div class="result-buttons">
                <button class="retry-button" id="retryButton">再试一次</button>
                <button class="next-button" id="nextButton">下一关</button>
            </div>
        </div>
    </div>

    <script src="../js/cognitive.js"></script>
</body>
</html>
