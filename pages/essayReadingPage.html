<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>散文阅读 - 情绪缓解</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/essayReadingPage.css">
</head>
<body>
    <div class="essay-reading-container">
        <!-- 提示图标 -->
        <div class="hint-icon" id="hintIcon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" stroke="currentColor" stroke-width="2"/>
                <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- 关闭按钮 -->
        <button class="close-button" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <!-- 弹出框 -->
        <div class="hint-modal" id="hintModal">
            <div class="hint-modal-content">
                <div class="hint-modal-header">
                    <h3>原文内容</h3>
                    <button class="close-modal" id="closeModal">&times;</button>
                </div>
                <div class="hint-modal-body" id="hintModalBody">
                </div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="essay-content">
            <article class="essay-article">
                <div class="essay-header">
                    <h1 class="essay-title"></h1>
                    <div class="essay-info">
                        <span class="essay-author"></span>
                        <span class="essay-source"></span>
                    </div>
                </div>
                <div class="essay-body">
                </div>
            </article>
        </div>
    </div>
    <script src="../js/essayReadingPage.js"></script>
</body>
</html>
