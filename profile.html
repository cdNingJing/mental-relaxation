<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑力训练游戏平台 - 个人资料</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tab-bar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <!-- 页面内容区域 -->
    <div class="content">
        <!-- 个人资料头部 -->
        <div class="profile-header">
            <a href="settings.html" class="settings-button">
                <i class="fas fa-cog text-white"></i>
            </a>
            <div class="user-info">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&q=80" alt="用户头像">
                </div>
                <div class="username">小明</div>
                <div class="bio">脑力训练爱好者，每天坚持锻炼大脑</div>
            </div>
        </div>

        <!-- 个人资料内容 -->
        <div class="profile-content">
            <!-- 用户等级卡片 -->
            <div class="level-card">
                <div class="level-label">大脑等级</div>
                <div class="level-info">
                    <div class="level-title">思维大师</div>
                    <div class="level-number">Lv.16</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span>15,750 / 21,000 XP</span>
                    <span>下一级：Lv.17</span>
                </div>
            </div>

            <!-- 徽章列表 -->
            <div class="section-header">
                <div class="section-title">我的徽章</div>
                <a href="#" class="see-all">查看全部</a>
            </div>

            <div class="badges-grid">
                <div class="badge-item">
                    <div class="badge-icon" style="background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)">
                        <i class="fas fa-award"></i>
                    </div>
                    <div class="badge-name">记忆大师</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon" style="background: linear-gradient(135deg, #FF9966 0%, #FF5E62 100%)">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div class="badge-name">七日连续</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
                        <i class="fas fa-crown"></i>
                    </div>
                    <div class="badge-name">算术天才</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon locked">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="badge-name">逻辑大师</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)">
                        <i class="fas fa-heart"></i>
                    </div>
                    <div class="badge-name">专注达人</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon" style="background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%)">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <div class="badge-name">反应之王</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon locked">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="badge-name">语言大师</div>
                </div>
                <div class="badge-item">
                    <div class="badge-icon locked">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="badge-name">完美主义</div>
                </div>
            </div>

            <!-- 最近成就 -->
            <div class="section-header">
                <div class="section-title">最近成就</div>
                <a href="#" class="see-all">查看全部</a>
            </div>

            <div class="achievement-card">
                <div class="achievement-icon" style="background: linear-gradient(135deg, #FF9966 0%, #FF5E62 100%)">
                    <i class="fas fa-fire"></i>
                </div>
                <div class="achievement-info">
                    <div class="achievement-name">七日连续挑战</div>
                    <div class="achievement-desc">连续七天完成每日挑战</div>
                </div>
                <div class="achievement-date">3天前</div>
            </div>

            <div class="achievement-card">
                <div class="achievement-icon" style="background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)">
                    <i class="fas fa-calculator"></i>
                </div>
                <div class="achievement-info">
                    <div class="achievement-name">算术达人</div>
                    <div class="achievement-desc">在快速算术中获得满分</div>
                </div>
                <div class="achievement-date">1周前</div>
            </div>

            <div class="achievement-card">
                <div class="achievement-icon" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="achievement-info">
                    <div class="achievement-name">记忆力提升</div>
                    <div class="achievement-desc">记忆力评分超过80分</div>
                </div>
                <div class="achievement-date">2周前</div>
            </div>

            <!-- 账户菜单 -->
            <div class="mt-8">
                <a href="#" class="menu-item">
                    <div class="menu-icon" style="background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="menu-text">编辑个人资料</div>
                    <div class="menu-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </a>
                <a href="#" class="menu-item">
                    <div class="menu-icon" style="background: linear-gradient(135deg, #FF9966 0%, #FF5E62 100%)">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="menu-text">通知设置</div>
                    <div class="menu-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </a>
                <a href="#" class="menu-item">
                    <div class="menu-icon" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)">
                        <i class="fas fa-heart"></i>
                    </div>
                    <div class="menu-text">我的收藏</div>
                    <div class="menu-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- iOS底部标签栏 -->
    <div class="tab-bar">
        <a href="index.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-home"></i></div>
            <div>首页</div>
        </a>
        <a href="games.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-gamepad"></i></div>
            <div>游戏</div>
        </a>
        <a href="stats.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-chart-bar"></i></div>
            <div>统计</div>
        </a>
        <a href="profile.html" class="tab-item active">
            <div class="tab-icon"><i class="fas fa-user"></i></div>
            <div>我的</div>
        </a>
    </div>
</body>
</html>
