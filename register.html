<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 脑力训练游戏平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .register-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            margin: 12px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: color 0.3s;
        }
        .input-group input:focus + i {
            color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-verify {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .btn-verify:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .agreement {
            margin: 25px 0;
            font-size: 14px;
            color: #718096;
        }
        .agreement label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .agreement input[type="checkbox"] {
            width: 18px;
            height: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .agreement input[type="checkbox"]:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .agreement a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        .agreement a:hover {
            color: #764ba2;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #718096;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }
        .login-link a:hover {
            color: #764ba2;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <img src="./assets/logo.png" alt="Logo">
            <h1>注册账号</h1>
            <p>加入我们，开启脑力训练之旅</p>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="手机号/邮箱" id="username">
            <i class="fas fa-user"></i>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="验证码" id="verifyCode">
            <button class="btn-verify" onclick="sendVerifyCode()">获取验证码</button>
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="设置密码" id="password">
            <i class="fas fa-lock"></i>
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="确认密码" id="confirmPassword">
            <i class="fas fa-lock"></i>
        </div>
        
        <div class="agreement">
            <label>
                <input type="checkbox" id="agreeTerms">
                我已阅读并同意
                <a href="terms.html?type=user">用户协议</a>
                和
                <a href="terms.html?type=privacy">隐私政策</a>
            </label>
        </div>
        
        <button class="btn-primary" onclick="register()">注册</button>
        
        <div class="login-link">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>

    <script>
        let countdown = 60;
        const verifyBtn = document.querySelector('.btn-verify');
        
        function sendVerifyCode() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('请先输入手机号/邮箱');
                return;
            }
            
            // 开始倒计时
            verifyBtn.disabled = true;
            verifyBtn.textContent = `${countdown}秒后重试`;
            
            const timer = setInterval(() => {
                countdown--;
                verifyBtn.textContent = `${countdown}秒后重试`;
                
                if (countdown === 0) {
                    clearInterval(timer);
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = '获取验证码';
                    countdown = 60;
                }
            }, 1000);
            
            // 这里添加发送验证码的逻辑
            alert('验证码已发送');
        }
        
        function register() {
            const username = document.getElementById('username').value;
            const verifyCode = document.getElementById('verifyCode').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            if (!username || !verifyCode || !password || !confirmPassword) {
                alert('请填写完整的注册信息');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            if (!agreeTerms) {
                alert('请阅读并同意用户协议和隐私政策');
                return;
            }
            
            // 这里添加注册逻辑
            window.location.href = 'login.html';
        }
        
        function showTerms(type) {
            // 这里添加显示条款的逻辑
            const terms = {
                user: '用户协议内容...',
                privacy: '隐私政策内容...'
            };
            alert(terms[type]);
        }
    </script>
</body>
</html>
