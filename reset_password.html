<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 脑力训练游戏平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .reset-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            margin: 0 12px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: color 0.3s;
        }
        .input-group input:focus + i {
            color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #718096;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }
        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .step.completed {
            background: #48bb78;
            color: white;
        }
        .step-line {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e2e8f0;
            z-index: 0;
        }
        .step-text {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #718096;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .step.active .step-text {
            color: #667eea;
            font-weight: 600;
        }
        .password-strength {
            margin-top: 5px;
            font-size: 12px;
            color: #718096;
        }
        .strength-meter {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>重置密码</h1>
            <p>请设置您的新密码</p>
        </div>
        
        <div class="steps">
            <div class="step-line"></div>
            <div class="step completed">
                <span>1</span>
                <div class="step-text">验证身份</div>
            </div>
            <div class="step active">
                <span>2</span>
                <div class="step-text">重置密码</div>
            </div>
            <div class="step">
                <span>3</span>
                <div class="step-text">完成</div>
            </div>
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="新密码" id="newPassword" oninput="checkPasswordStrength()">
            <i class="fas fa-lock"></i>
            <div class="password-strength">
                <div class="strength-meter">
                    <div class="strength-meter-fill" id="strengthMeter"></div>
                </div>
                <div id="strengthText">密码强度：弱</div>
            </div>
        </div>
        
        <div class="input-group">
            <input type="password" placeholder="确认新密码" id="confirmPassword">
            <i class="fas fa-lock"></i>
        </div>
        
        <button class="btn-primary" onclick="resetPassword()">确认修改</button>
    </div>

    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const meter = document.getElementById('strengthMeter');
            const text = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            const strengthPercent = (strength / 5) * 100;
            meter.style.width = `${strengthPercent}%`;
            
            if (strength <= 2) {
                meter.style.backgroundColor = '#f56565';
                text.textContent = '密码强度：弱';
            } else if (strength <= 4) {
                meter.style.backgroundColor = '#f6ad55';
                text.textContent = '密码强度：中';
            } else {
                meter.style.backgroundColor = '#48bb78';
                text.textContent = '密码强度：强';
            }
        }
        
        function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword || !confirmPassword) {
                alert('请填写完整的密码信息');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            // 这里添加重置密码的逻辑
            window.location.href = 'reset_success.html';
        }
    </script>
</body>
</html>
