<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置成功 - 脑力训练游戏平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .success-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            margin: 0 12px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #718096;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }
        .step.completed {
            background: #48bb78;
            color: white;
            box-shadow: 0 4px 10px rgba(72, 187, 120, 0.3);
        }
        .step-line {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e2e8f0;
            z-index: 0;
        }
        .step-text {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #718096;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .step.completed .step-text {
            color: #48bb78;
            font-weight: 600;
        }
        .countdown {
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="logo">
            <h1>重置成功</h1>
            <p>您的密码已经成功重置</p>
        </div>
        
        <div class="steps">
            <div class="step-line"></div>
            <div class="step completed">
                <span>1</span>
                <div class="step-text">验证身份</div>
            </div>
            <div class="step completed">
                <span>2</span>
                <div class="step-text">重置密码</div>
            </div>
            <div class="step completed">
                <span>3</span>
                <div class="step-text">完成</div>
            </div>
        </div>
        
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        
        <h2 class="text-xl font-semibold mb-4">密码重置成功</h2>
        <p class="text-gray-600 mb-8">您的密码已经成功重置，请使用新密码登录</p>
        
        <button class="btn-primary" onclick="goToLogin()">立即登录</button>
        
        <div class="countdown" id="countdown">
            5秒后自动跳转到登录页面
        </div>
    </div>

    <script>
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = `${countdown}秒后自动跳转到登录页面`;
            
            if (countdown === 0) {
                clearInterval(timer);
                goToLogin();
            }
        }, 1000);
        
        function goToLogin() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
