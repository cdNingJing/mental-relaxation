<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑力训练游戏平台 - 统计数据</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/tab-bar.css">
    <link rel="stylesheet" href="css/stats.css">
</head>
<body>

    <!-- 页面内容区域 -->
    <div class="content">
        <h1 class="text-2xl font-bold mb-6">训练统计</h1>
        
        <!-- 时间周期选择 -->
        <div class="time-tabs">
            <div class="time-tab">周</div>
            <div class="time-tab active">月</div>
            <div class="time-tab">年</div>
            <div class="time-tab">全部</div>
        </div>
        
        <!-- 主要统计卡片 -->
        <div class="big-stat-card">
            <div class="big-stat-value">138</div>
            <div class="big-stat-label">本月训练总分数</div>
            <div class="stat-change stat-increase">
                <i class="fas fa-arrow-up mr-1"></i> 23% 相比上月
            </div>
        </div>
        
        <!-- 训练时长统计 -->
        <div class="stats-card">
            <div class="stats-header">
                <div class="stats-title">训练时长</div>
                <div class="time-selector">查看详情</div>
            </div>
            <canvas id="timeChart" height="180"></canvas>
        </div>
        
        <!-- 能力评估 -->
        <div class="stats-card">
            <div class="stats-header">
                <div class="stats-title">脑力能力分布</div>
                <div class="time-selector">查看详情</div>
            </div>
            <div class="radar-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
        
        <!-- 各项能力评级 -->
        <div class="stats-card">
            <div class="stats-header">
                <div class="stats-title">能力评级</div>
            </div>
            
            <div class="skill-rating">
                <div class="skill-name">记忆力</div>
                <div class="skill-level" style="width: 85%"></div>
                <div class="skill-value">85</div>
            </div>
            
            <div class="skill-rating">
                <div class="skill-name">专注力</div>
                <div class="skill-level" style="width: 75%"></div>
                <div class="skill-value">75</div>
            </div>
            
            <div class="skill-rating">
                <div class="skill-name">逻辑思维</div>
                <div class="skill-level" style="width: 90%"></div>
                <div class="skill-value">90</div>
            </div>
            
            <div class="skill-rating">
                <div class="skill-name">反应速度</div>
                <div class="skill-level" style="width: 65%"></div>
                <div class="skill-value">65</div>
            </div>
            
            <div class="skill-rating">
                <div class="skill-name">计算能力</div>
                <div class="skill-level" style="width: 80%"></div>
                <div class="skill-value">80</div>
            </div>
        </div>
        
        <!-- 最近活动 -->
        <h2 class="text-lg font-semibold mb-4 mt-6">最近活动</h2>
        
        <div class="activity-card">
            <div class="activity-icon" style="background: linear-gradient(135deg, #FF9966 0%, #FF5E62 100%)">
                <i class="fas fa-brain"></i>
            </div>
            <div class="activity-info">
                <div class="activity-date">今天 14:30</div>
                <div class="activity-name">记忆翻牌</div>
                <div class="activity-detail">完成难度：中级</div>
            </div>
            <div class="activity-score">92</div>
        </div>
        
        <div class="activity-card">
            <div class="activity-icon" style="background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%)">
                <i class="fas fa-calculator"></i>
            </div>
            <div class="activity-info">
                <div class="activity-date">昨天 16:15</div>
                <div class="activity-name">快速算术</div>
                <div class="activity-detail">完成20题</div>
            </div>
            <div class="activity-score">85</div>
        </div>
        
        <div class="activity-card">
            <div class="activity-icon" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)">
                <i class="fas fa-puzzle-piece"></i>
            </div>
            <div class="activity-info">
                <div class="activity-date">2天前 09:45</div>
                <div class="activity-name">数独挑战</div>
                <div class="activity-detail">完成难度：专家</div>
            </div>
            <div class="activity-score">98</div>
        </div>
    </div>

    <!-- 添加模态框 -->
    <div class="modal" id="timeDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">训练时长详情</div>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="detail-stats">
                <div class="detail-stat-item">
                    <div class="detail-stat-label">平均每日训练时长</div>
                    <div class="detail-stat-value">32分钟</div>
                </div>
                <div class="detail-stat-item">
                    <div class="detail-stat-label">最长训练时长</div>
                    <div class="detail-stat-value">45分钟</div>
                </div>
                <div class="detail-stat-item">
                    <div class="detail-stat-label">最短训练时长</div>
                    <div class="detail-stat-value">15分钟</div>
                </div>
                <div class="detail-stat-item">
                    <div class="detail-stat-label">总训练时长</div>
                    <div class="detail-stat-value">960分钟</div>
                </div>
            </div>
            <div class="detail-chart">
                <canvas id="detailTimeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- iOS底部标签栏 -->
    <div class="tab-bar">
        <a href="index.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-home"></i></div>
            <div>首页</div>
        </a>
        <a href="games.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-gamepad"></i></div>
            <div>游戏</div>
        </a>
        <a href="stats.html" class="tab-item active">
            <div class="tab-icon"><i class="fas fa-chart-bar"></i></div>
            <div>统计</div>
        </a>
        <a href="profile.html" class="tab-item">
            <div class="tab-icon"><i class="fas fa-user"></i></div>
            <div>我的</div>
        </a>
    </div>

    <script src="js/stats.js"></script>
</body>
</html>
